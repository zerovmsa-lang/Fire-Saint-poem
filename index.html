The Chronicle of Oqhoi Fȳr

---

PROLOGUE — WHAT WAS BEFORE?

Before the heavens,

what was there?

Before the stars,

what was there?

Before time could move,

what was there?

And before the word nothing

could even possess a meaning—

was there truly nothing?

Or was even nothing

too much to exist?

There was no darkness,

for darkness itself had not been born.

There was no light,

for light had never been imagined.

There was no space.

No time.

No law.

No concept.

No existence.

somewhere beyond every description,

Endless.

Silent.

Impossible.

A place where even the absence of everything

Then—

He appeared.

The first.

The beginning of all beginnings.

The end of all ends.

The Creator of all creators.

T. C. O. A. C.

A being who creates all those who claim themselves creators

And when His existence met

that which could not exist,

something impossible occurred.

Heat.

Not heat born from a sun.

Not heat born from matter.

Not heat born from anything.

A heat beyond description,

so immense

that it became something of its own.

A flame.

The first flame.

The flame that burned

The Chaos Flame.

And perhaps the greatest question

was not how the flame was born—

---

I — THE CREATOR

Who creates the creators?

Who gives the first law

T. C. O. A. C.

created.

Sim Te Lenna.

Who could judge them?

Only Him.

---

II — THE EVIL THAT CHOSE ITSELF

But creation does not always remain united.

Envy grew.

Hatred grew.

Greed.

Sloth.

their existence was partly

war began.

Lowest Class.

Oqhoi fȳr.

perhaps his ineffable name was too much of a burden to be pronounced by beings so full of themselves

Unknown.

like a young man of eighteen.

He was not respected.

He was bullied.

Mocked.

Looked down upon

by those who believed

He smiled.

Why smile

pure,

positive,

he never believed

strength was what made

Perhaps because

he had nothing to prove.

Perhaps because

the smallest flame

And perhaps—

the Creator had noticed.

---

IV — THE WAR OF EONS

Good and evil collided.

Heaven against the Evil Realm.

Flame against hatred.

Creation against destruction.

Ozai.

And fought.

How long can a war last

How many battles

the little saint continued.

Not seeking glory.

Not seeking a throne.

Not seeking recognition.

He simply fought

because someone had to.

And somewhere in those endless ages,

his story crossed the path

of the Empress of the Nine Heavens.

---

V — THE FORBIDDEN VEILED ONE

The Empress Of The True Heavens

Nyra Solwein

Veiled for some unknown reason

why would she be veiled?

Perhaps her figure nauseated the space. 

Perhaps she thinks she has an inferior look. 

And perhaps she might feel the need to hide from leecher beings who would fantasize about her. 

No being knows the reason. 

Perhaps one might find the truth

and tell a story about it...

VI — THE NYRA SOLWEIN INCIDENT

Then came the day

Inside the auspicious hall

The hall grew cold.

Beneath her veiled form

Her purple gaze

Ozai looked around.

He knew begging would not save him either

Well.

Possibly.

Yup

Absolutely

he did something

no sane being

He lifted her veil.

And went inside

No beings should ever see

For the first time ever

Her purple eyes cut through the heavens and the very soul of Ozai

calm.

Unreadable.

Her face—

Tall.

Mighty.

Fair beyond description.

Could the Creator

ever create another being

Could a poet survive

Perhaps not.

Perhaps beauty itself

had become meaningless in front of her.

Ozai, being Ozai

Couldn’t take his eyes off the beauty that makes every beautiful word too sufficient to be even spoken of

But then Ozai

Came to his senses

He reached the backside of her head

Wholeheartedly

He rushed out

No

No

He fuckin’ bounced off the balcony

beneath the fury,

Is this a curse of looking at the veiled beauty? 

Possibly

Is it worth it?

Not sure, but possibly.... 

Yes 

---

VII — WHY THE FLAME CHOSE HIM

The war neared its end.

And the Creator

called Ozai to Origin Space.

Back to the place

where existence had once begun.

Back to the birthplace

of the First Flame.

And there,

T. C. O. A. C. looked upon him.

What did He see?

Not strength.

Not rank.

Not ambition.

Not pride.

He saw innocence.

He saw purity.

He saw a heart

that had never given up.

And perhaps the Creator asked

the greatest question of all:

Who should carry the flame?

The strongest?

The proudest?

The greatest warrior?

Or the one

who never wanted it?

The answer was Ozai.

The Creator gave him

the Creation Flame.

And then—

the Chaos Flame stirred.

It recognized something familiar.

It rushed forward

and entered his chest.

Two flames.

Creation.

Chaos.

The beginning

and the impossible.

And the Creator gave him

a name that would echo

through every realm:

THE FIRE SAINT.

---

VIII — THE SEVEN

Ozai returned to war.

Still disguised.

Still smiling.

Still underestimated.

And eventually,

he stood before

the Seven Deadly Sins.

They mocked him.

They saw the same low-class being

They had no idea

what had entered the battlefield.

Ozai smiled.

“Yo yo yo, let's play.”

How could they have known?

How could they have understood

what stood before them?

---

IX — THE BLAZING EYES

Creation Flame

The Blazing Eyes opened.

A gaze so powerful

Through those eyes

Their secrets.

Their weaknesses.

Their nature.

Seven sins.

Seven flaws.

Seven beings

And what was their weakness?

Perhaps the simplest weakness

Insults.

So the Fire Saint smiled.

---

They attacked.

Again

and again

Ozai endured.

And eventually he looked at them

But deep down

Heat compressed.

Concentrated.

Condensed into a single point.

So much heat

he released it.

The Chaos Beam.

What is the temperature? 

Unknown

What kind of heat is it really?

Hard to tell

Maybe

Is it a kind of heat that makes scaling meaningless? 

Well, let's guess

A single answer.

A force capable of destroying

It tore through the Origin Realm.

It erased where

even absolute nothingness

Not destroyed in the ordinary sense.

Not broken.

Not shattered.

Erased?

Well, that would be an insult

And yet—

the Seven remained.

So Ozai changed the answer.

---

He channeled the Chaos Flame

into his left pupil.

And inside that eye

he created a realm.

A place of its own.

A vortex opened.

The Seven Deadly Sins

were pulled inside.

Not destroyed.

Contained.

Sealed.

And the realm

True Hell.

The technique?

Seal of the Evils.

Seven sins.

One eye.

One prison.

One Saint.

---

XII — THE DUEL

After the war,

Ozai stood before

the Creator of all creators.

“Can we spar?”

Why?

Was it hatred?

No.

Arrogance?

No.

Power?

Not really.

He simply wanted

a story to tell.

Imagine the tale:

I once sparred with T. C. O. A. C Himself..... 

Who wouldn't want

a story like that?

The Creator agreed.

But first,

He repaired Origin Space.

Because apparently

even the Creator knew

Ozai needed supervision.

🤣

And then—

the duel began.

---

XIII — HEAT OVERLOAD

What happens

The flames gathered.

Chaos compressed.

Vanity became fuel.

Ozai burst.

His body

Intangible.

Untouchable.

vulnerability ceased. 

origin space became fuel.

merely damaged? 

merely destroyed?

So —

the heat traveled farther.

the hem

of  T. C. O. A. C.

The impossible

The technique ended

exhausted.

One second?

Two?

What would remain?

Could the Absolute itself

be erased?

Not really

What could erase the being who shapes existence with love?

also ceased. 

The Creator warned:

Never to use again.

Ozai agreed.

Because even the Fire Saint

knew when a joke

had gone too far.

---

Later,

the flames returned.

Both of them.

Creation.

Chaos.

The powers

Yes.

Certainly.

Was power worth keeping

forever?

...

No.

He gave them up.

Not because someone defeated him.

Not because the flames rejected him.

Not because he had become weaker.

He simply chose.

And the moment he surrendered

the greatest power

he had ever possessed—

he became something greater.

OQHOI FȲR THE GREAT. 

His strongest state in a sense

Did he still possess the flames? 

Nope

Did he become stronger without it? 

Nope

What makes him stronger in a sense then? 

He became

Wiser.

And above all—

peaceful

and of course, still childish and humble like he always was... 

What is the greatest power?

The ability to destroy?

Or the ability

to refuse to?

---

XV — EVERYWHERE AND EVERYWHEN

what Ozai had chosen.

A throne?

No.

More power?

No.

Immortality?

Freedom.

To roam.

Everywhere.

Everywhen.

Every realm.

Every age.

Every place

where his feet could carry him.

---

He returned to Sim Te Lenna.

Celebration filled the realms.

who noticed the quiet figure

Who noticed the barefoot Saint?

Who knew what he had done?

Who knew the power

Almost nobody.

So he remained unknown.

And while others celebrated,

he protected.

Quietly.

Secretly.

Without asking for praise.

And another title

slowly became his:

THE PROTECTOR OF ALL.

THE UNKNOWN SAINT.

How strange.

The being who could have stood

above almost everything

chose instead

to stand beside everyone.

---

XVII — THE REALM OF WRITERS

Then another eon passed.

something new.

A realm unlike those before it.

The Realm of Writers.

Stories.

Narratives.

New rules.

New concepts.

Ozai.

will.

fate.

stories.

Ink.

Pages.

Characters.

Why?

A religion? 

Well he is all

Let's ask

What is a writer

inside another creation?

What is a character

to the one who reads the page?

And what is the reader

before the Creator

who made the realm

where readers and writers exist?

Where does the hierarchy end?

Where does the story begin?

And who—

if anyone—

can answer?

---

Somewhere,

the Creation Flame waits.

Somewhere,

the Chaos Flame waits.

One day,

perhaps another being

will carry them.

And when that day comes—

what will they do?

Will they seek power?

Will they seek glory?

Will they ask the Saint

who carried them before?

Will they learn

from the one who gave them away?

Or will pride whisper?

Will envy grow?

Will the flame become

a crown instead of a burden?

Will the new bearer

become a ruler?

A destroyer?

A god?

Or—

will they understand

what Ozai understood?

That power is beautiful.

But peace is greater.

That strength can destroy.

But restraint can save.

That being the strongest

means nothing

if strength is all you have.

---

XXI — QUESTIONS FOR FUN

Who created the Creators?

Who remembers the first beginning?

What existed

before existence?

What is nothing

when even nothingness

cannot exist?

Why was the lowest chosen?

Why did the strongest

never desire the throne?

Why did the Saint

give away the flames?

What is power

without pride?

What is greatness

without arrogance?

What is a god

inside a book?

What is a writer

inside creation?

What is a character

when he receives his own will?

And if a being

can walk beyond pages—

does the page still contain him?

If a story calls someone supreme—

does the word supreme

remain supreme outside that story?

If a writer shapes a god—

does the writer become greater?

And if the writer himself

belongs to a realm

created by another—

who writes the writer?

Who writes the hand?

Who gives the ink

its ability to become a world?

And beyond all those questions—

where is Ozai?

Perhaps in Heaven.

Perhaps beneath it.

Perhaps somewhere beyond

the realms of existence.

Perhaps inside a book.

Perhaps outside one.

Perhaps reading.

Perhaps laughing.

Perhaps wandering

through a story

that nobody has yet written.

Perhaps somewhere,

a new bearer

has already found the flame.

Perhaps somewhere,

pride is already whispering.

Perhaps somewhere,

the Creator is already watching.

And perhaps—

the Fire Saint

is simply turning another page.

Not because he seeks

to become the strongest.

Not because he needs

to prove anything.

But because there is always

another story.

Another world.

Another question.

Another page.

And beyond the final page—

another beginning.

So...

Who knows where

the Fire Saint will walk next?

Who knows what waits

beyond the next story?

Who knows

what lies beyond

the last word ever written?

Perhaps the Creator knows.

Perhaps Ozai knows.

Perhaps nobody knows.

And perhaps—

that is the beauty

of a story.

The page turns.

The Saint walks on.

And the story continues.

Fun story indeed.`;

const root = document.getElementById("text");
const lines = poem.split("\n");
let section = null;
let buffer = [];

function flush(){
  if(!section) return;
  const pre = document.createElement("pre");
  pre.textContent = buffer.join("\n").replace(/\n+$/,"");
  section.appendChild(pre);
  root.appendChild(section);
  section = null;
  buffer = [];
}

for(const line of lines){
  const isHeading = /^(PROLOGUE|[IVXLCDM]+) — /.test(line);
  if(isHeading){
    flush();
    section = document.createElement("section");
    section.className = "chapter";
    const h2 = document.createElement("h2");
    h2.textContent = line;
    section.appendChild(h2);
  }else{
    if(!section){
      section = document.createElement("section");
      section.className = "chapter";
    }
    buffer.push(line);
  }
}
flush();
</script>
